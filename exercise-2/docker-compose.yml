version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nihongo-backend
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nihongo-frontend-full
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
